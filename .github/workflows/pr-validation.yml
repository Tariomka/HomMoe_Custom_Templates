name: PR Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  GO_VERSION: 1.26.3
  coverage_file: coverage.txt
  coverage_artifact: code-coverage
  coverage_percentage_threshold: 60.0

jobs:
  check-go-mod:
    name: Check for dirty changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check go mod
        run: |
          go mod tidy
          git diff --exit-code go.mod
          git diff --exit-code go.sum

  run-gci-lint:
    name: Run Golangci-lint
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: binary

  run-vulnerability-scan:
    name: Run Vulnerability Scan
    runs-on: ubuntu-latest
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check UI for vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
           go-version-input: ${{ env.GO_VERSION }}
           go-package: ./app/...

      - name: Check Internal for vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
           go-version-input: ${{ env.GO_VERSION }}
           go-package: ./internal/...

      - name: Check Tests for vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
           go-version-input: ${{ env.GO_VERSION }}
           go-package: ./test/...

  check-build:
    name: Check Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build .

  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: go test -v -coverprofile=${{ env.coverage_file }} -coverpkg=./internal/...,./app/... ./test/unit/...

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.coverage_artifact }}
          path: ${{ env.coverage_file }}

  code_coverage:
    name: Code coverage report
    runs-on: ubuntu-latest
    needs: run-unit-tests
    permissions:
      contents:      read
      actions:       read  # to download code coverage results from unit test job
      pull-requests: write # write permission needed to comment on PR
    steps:
      - name: Coverage report
        uses: fgrosse/go-coverage-report@v1.3.0
        id: coverage
        with:
          coverage-artifact-name: ${{ env.coverage_artifact }}
          coverage-file-name: ${{ env.coverage_file }}
          root-package: github.com/Tariomka/hommoe_custom_templates
          trim: github.com/Tariomka/hommoe_custom_templates/
          exclude: "(^|/)test/"

      - name: Fail if coverage drops
        if: ${{ github.event_name == 'pull_request' && steps.coverage.outputs.coverage_trend == 'decreased' }}
        run: echo "Coverage decreased!" && exit 1

      - name: Enforce minimum coverage
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          COV="${{ steps.coverage.outputs.total_coverage }}"
          if (( $(echo "$COV < ${{ env.coverage_percentage_threshold }}" | bc -l) )); then
            echo "Coverage $COV% is below ${{ env.coverage_percentage_threshold }}%" && exit 1
          fi

  run-integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        run: go test -v -tags integration_test ./test/integration/...

      - name: Run performance tests
        run: go test -v -tags integration_test ./test/performance/... -bench . -benchmem -benchtime 500x -timeout 30s