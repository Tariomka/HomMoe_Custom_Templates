name: PR Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  GO_VERSION: 1.26.5
  coverage_file: coverage.txt
  coverage_artifact: code-coverage
  coverage_percentage_threshold: 60.0

jobs:
  check-go-mod:
    name: Check for dirty changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check go mod
        run: |
          go mod tidy
          git diff --exit-code go.mod
          git diff --exit-code go.sum

  run-gci-lint:
    name: Run Golangci-lint
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: binary
          args: --disable=godox,dupl,unparam,gochecknoglobals # these are the same linters marked as warning level in .golangci.yml

  run-vulnerability-scan:
    name: Run Vulnerability Scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check for vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
           go-version-input: ${{ env.GO_VERSION }}
           go-package: ./...

  check-build:
    name: Check Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      - name: Vet (including integration_test-gated files)
        run: go vet -tags=integration_test ./...

  check-windows:
    name: Check Windows Build & Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      - name: Run unit tests
        run: go test ./test/unit/...

  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: go test -v -coverprofile=${{ env.coverage_file }} -coverpkg=./internal/...,./app/... ./test/unit/...

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.coverage_artifact }}
          path: ${{ env.coverage_file }}

  run-race-tests:
    name: Run Unit Tests (race detector)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests with race detector
        run: go test -race ./test/unit/...

  code_coverage:
    name: Code coverage report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: run-unit-tests
    permissions:
      contents:      read
      actions:       read  # to download code coverage results from unit test job
      pull-requests: write # write permission needed to comment on PR
    steps:
      - name: Coverage report
        uses: fgrosse/go-coverage-report@v1.3.0
        id: coverage
        with:
          coverage-artifact-name: ${{ env.coverage_artifact }}
          coverage-file-name: ${{ env.coverage_file }}
          root-package: github.com/Tariomka/hommoe_custom_templates
          trim: github.com/Tariomka/hommoe_custom_templates/
          exclude: (?:^|/)test/(.+)$

      - name: Fail if coverage drops
        if: ${{ steps.coverage.outputs.coverage_trend == 'decreased' }}
        run: echo "Coverage decreased!" && exit 1

      - name: Enforce minimum coverage
        run: |
          COV="${{ steps.coverage.outputs.total_coverage }}"
          if (( $(echo "$COV < ${{ env.coverage_percentage_threshold }}" | bc -l) )); then
            echo "Coverage $COV% is below ${{ env.coverage_percentage_threshold }}%" && exit 1
          fi

  run-integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        run: go test -v -tags integration_test ./test/integration/...

      - name: Run performance tests
        run: go test -v -tags integration_test ./test/performance/... -bench . -benchmem -benchtime 500x -timeout 30s

  run-gui-integration-tests:
    name: Run GUI Integration Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Mesa software renderer and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-utils libegl1 libgles2 libgl1-mesa-dri \
            libx11-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev

      - name: Run GUI integration tests
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1" # force Mesa llvmpipe (no physical GPU on hosted runners)
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            go test -v -tags "integration_test,gui" ./test/integration/gui/...

      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gui-snapshot-failures
          path: test/integration/gui/__snapshots__/**/*.failure
          if-no-files-found: ignore