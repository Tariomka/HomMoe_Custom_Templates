name: PR Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  GO_VERSION: 1.26.3

jobs:
  check-go-mod:
    name: Check for dirty changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check go mod
        run: |
          go mod tidy
          git diff --exit-code go.mod
          git diff --exit-code go.sum

  run-gci-lint:
    name: Run Golangci-lint
    runs-on: ubuntu-latest

    steps:
      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9

  run-vulnerability-scan:
    name: Run Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check UI for vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
           go-version-input: ${{ env.GO_VERSION }}
           go-package: ./app/...

      - name: Check Internal for vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
           go-version-input: ${{ env.GO_VERSION }}
           go-package: ./internal/...

      - name: Check Tests for vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
           go-version-input: ${{ env.GO_VERSION }}
           go-package: ./test/...

  check-build:
    name: Check Build
    runs-on: ubuntu-latest

    steps:
      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build .

  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: go test -v ./test/...

  run-integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        run: go test -v -tags integration_test ./test/integration/...

      - name: Run performance tests
        run: go test -v -tags integration_test ./test/performance/... -bench . -benchtime 500x -timeout 30s