name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

        
env:
  windows_binary: HeroesOldenEra_CustomTemplates_win_x64.exe
  linux_binary: HeroesOldenEra_CustomTemplates_linux_x64

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            binary: HeroesOldenEra_CustomTemplates_win_x64.exe
            cgo: '0'
          - goos: linux
            goarch: amd64
            binary: HeroesOldenEra_CustomTemplates_linux_x64
            cgo: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
          cache: true

      - name: Install Gio UI system dependencies (Linux build)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libffi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            xorg-dev

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist
          go build -ldflags "-s -w" -o "dist/${{ matrix.binary }}" .

      - name: Make Linux binary executable
        if: matrix.goos == 'linux'
        run: chmod +x "dist/${{ matrix.binary }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Ensure Linux binary is executable
        run: chmod +x dist/HeroesOldenEra_CustomTemplates

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/${{ env.windows_binary }}
            dist/${{ env.linux_binary }}
