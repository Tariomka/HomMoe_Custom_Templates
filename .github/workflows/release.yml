name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

# Never run two releases for the same ref at once; do not cancel a running
# release half-way through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  windows_binary: HeroesOldenEra_CustomTemplates_win_x64.exe
  linux_binary: HeroesOldenEra_CustomTemplates_linux_x64
  GO_VERSION: 1.26.5

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            binary: HeroesOldenEra_CustomTemplates_win_x64.exe
            cgo: '0'
          - goos: linux
            goarch: amd64
            binary: HeroesOldenEra_CustomTemplates_linux_x64
            cgo: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # On workflow_dispatch, build the tag being released, not the branch HEAD.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Project
        uses: ./.github/workflows/setup-steps
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.event.inputs.tag || github.ref_name }}" -o "dist/${{ matrix.binary }}" .

      - name: Make Linux binary executable
        if: matrix.goos == 'linux'
        run: chmod +x "dist/${{ matrix.binary }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Ensure Linux binary is executable
        run: chmod +x dist/${{ env.linux_binary }}

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/${{ env.windows_binary }}
            dist/${{ env.linux_binary }}
            dist/checksums.txt
